<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>E-Paper Hub</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f5;
        color: #364f6b;
      }
    </style>
  </head>
  <body class="min-h-screen pb-12 flex flex-col items-center antialiased">
    <div class="w-full max-w-md px-4 pt-8 space-y-6">
      
      <!-- iOS Style Header -->
      <header class="flex justify-between items-center px-2">
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-[#364F6B]">
            Schreibtisch Hub
          </h1>
          <p class="text-xs font-medium text-[#364F6B]/60">
            Heltec E-Paper Display Steuerung
          </p>
        </div>
        <div
          id="connection-badge"
          class="w-3 h-3 rounded-full bg-[#3FC1C9] shadow-sm animate-pulse"
          title="System bereit"
        ></div>
      </header>

      <!-- Mode Selector -->
      <section
        class="bg-[#364F6B]/5 p-1.5 rounded-2xl flex gap-1 shadow-inner backdrop-blur-md"
      >
        <button
          onclick="setMode('hvv')"
          id="btn-hvv"
          class="flex-1 py-2.5 rounded-xl text-xs font-semibold transition-all duration-200 bg-[#364F6B] text-[#F5F5F5] shadow-sm"
        >
          HVV
        </button>
        <button
          onclick="setMode('mood')"
          id="btn-mood"
          class="flex-1 py-2.5 rounded-xl text-xs font-semibold transition-all duration-200 text-[#364F6B]/70 hover:text-[#364F6B]"
        >
          Pixel-Art & Mood
        </button>
        <button
          onclick="setMode('todo')"
          id="btn-todo"
          class="flex-1 py-2.5 rounded-xl text-xs font-semibold transition-all duration-200 text-[#364F6B]/70 hover:text-[#364F6B]"
        >
          To-Do
        </button>
      </section>

      <!-- MOOD & PIXEL-ART EDITOR CONFIG -->
      <section
        id="section-mood"
        class="bg-white rounded-3xl p-5 shadow-xl shadow-[#364F6B]/5 space-y-4 hidden border border-[#364F6B]/5"
      >
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-[#364F6B] tracking-wide uppercase">
            Pixel-Art Editor & Text
          </h2>
          <span
            class="text-xs px-2 py-0.5 rounded-full bg-[#3FC1C9]/20 text-[#3FC1C9] font-bold"
            >Live JSON</span
          >
        </div>

        <div>
          <label class="block text-xs font-semibold text-[#364F6B]/60 mb-2 ml-1">Motiv wählen</label>
          <div class="grid grid-cols-3 gap-2">
            <button onclick="loadMotif('heart')" id="btn-motif-heart" class="p-3 rounded-2xl border-2 border-[#364F6B] bg-[#364F6B]/5 text-center transition flex flex-col items-center gap-1">
              <span class="text-lg">❤️</span>
              <span class="text-[11px] font-bold text-[#364F6B]">Herz</span>
            </button>
            <button onclick="loadMotif('coffee')" id="btn-motif-coffee" class="p-3 rounded-2xl border-2 border-transparent bg-[#F5F5F5] text-center transition flex flex-col items-center gap-1 hover:border-[#364F6B]/30">
              <span class="text-lg">☕</span>
              <span class="text-[11px] font-semibold text-[#364F6B]/70">Kaffee</span>
            </button>
            <button onclick="loadMotif('custom')" id="btn-motif-custom" class="p-3 rounded-2xl border-2 border-transparent bg-[#F5F5F5] text-center transition flex flex-col items-center gap-1 hover:border-[#364F6B]/30">
              <span class="text-lg">✏️</span>
              <span class="text-[11px] font-semibold text-[#364F6B]/70">Custom</span>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-[#364F6B]/60 mb-1 ml-1">Pixel-Grid (Matrix)</label>
          <textarea
            id="pixel-grid-input"
            rows="8"
            class="w-full bg-[#364F6B]/5 border-none rounded-xl p-3 text-xs font-mono text-[#364F6B] focus:ring-2 focus:ring-[#3FC1C9] focus:outline-none transition leading-tight resize-none"
            placeholder="Hier das Raster aus # und . bearbeiten..."
          ></textarea>
        </div>

        <div class="space-y-3 pt-1">
          <div>
            <label class="block text-xs font-semibold text-[#364F6B]/60 mb-1 ml-1">Status-Nachricht</label>
            <input
              type="text"
              id="mood-status"
              class="w-full bg-[#F5F5F5] border-none rounded-xl px-4 py-3 text-sm text-[#364F6B] focus:ring-2 focus:ring-[#3FC1C9] focus:outline-none transition"
              placeholder="z.B. Eigene Nachricht..."
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-[#364F6B]/60 mb-1 ml-1">Zusatz / Zitat</label>
            <input
              type="text"
              id="mood-quote"
              class="w-full bg-[#F5F5F5] border-none rounded-xl px-4 py-3 text-sm text-[#364F6B] focus:ring-2 focus:ring-[#3FC1C9] focus:outline-none transition"
              placeholder="Dein Untertitel"
            />
          </div>
          <button
            onclick="saveMood()"
            class="w-full bg-[#364F6B] text-[#F5F5F5] font-semibold py-3 rounded-xl text-sm shadow-md hover:bg-[#364F6B]/90 active:scale-[0.98] transition"
          >
            Auf GitHub & Display übertragen 🚀
          </button>
        </div>
      </section>

      <!-- TO-DO LIST CONFIG -->
      <section
        id="section-todo"
        class="bg-white rounded-3xl p-5 shadow-xl shadow-[#364F6B]/5 space-y-4 hidden border border-[#364F6B]/5"
      >
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-[#364F6B] tracking-wide uppercase">
            To-Do Fokus
          </h2>
          <span
            id="todo-counter"
            class="text-xs px-2 py-0.5 rounded-full bg-[#FC5185]/10 text-[#FC5185] font-bold"
            >0 offen</span
          >
        </div>

        <div class="flex gap-2">
          <input
            type="text"
            id="new-todo-text"
            class="flex-1 bg-[#F5F5F5] border-none rounded-xl px-4 py-3 text-sm text-[#364F6B] focus:ring-2 focus:ring-[#3FC1C9] focus:outline-none transition"
            placeholder="Neue Aufgabe hinzufügen..."
            onkeypress="if (event.key === 'Enter') addTodo();"
          />
          <button
            onclick="addTodo()"
            class="bg-[#3FC1C9] text-[#364F6B] font-bold px-5 rounded-xl text-sm shadow-md hover:opacity-90 active:scale-[0.98] transition flex items-center justify-center"
          >
            +
          </button>
        </div>

        <div id="todo-list" class="space-y-2 max-h-64 overflow-y-auto pr-1"></div>
      </section>

      <!-- HVV INFO CARD -->
      <section
        id="section-hvv"
        class="bg-white rounded-3xl p-6 shadow-xl shadow-[#364F6B]/5 space-y-3 border border-[#364F6B]/5 text-center py-10"
      >
        <div
          class="w-12 h-12 bg-[#3FC1C9]/20 text-[#3FC1C9] rounded-2xl mx-auto flex items-center justify-center text-xl font-bold"
        >
          🚇
        </div>
        <h2 class="text-base font-bold text-[#364F6B]">HVV Monitor aktiv</h2>
        <p class="text-xs text-[#364F6B]/60 max-w-xs mx-auto">
          Das Display zeigt aktuell die live Fahrplandaten deiner Station an.
          Wähle oben einen anderen Modus, um das Display fernzusteuern.
        </p>
      </section>

      <!-- Status Toast -->
      <div
        id="status-toast"
        class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#364F6B] text-[#F5F5F5] px-4 py-2.5 rounded-full text-xs font-medium shadow-2xl transition-all duration-300 opacity-0 pointer-events-none"
      >
        Gespeichert!
      </div>
    </div>

    <script>
      let currentMode = "hvv";
      let tasks = [];

      const motifs = {
        heart: [
          "....######..######....",
          "...########.########...",
          "..####################..",
          ".######################.",
          ".###.#################.",
          "########################",
          "########################",
          "########################",
          ".######################.",
          "..####################..",
          "...##################...",
          "....################....",
          "     ##############     "
        ],
        coffee: [
          "    ###########        ",
          "    #         #    ### ",
          "    #         #   #   #",
          "    #         #  #     #",
          "    #         #   #   #",
          "    #         #    ### ",
          "     #########         ",
          " ###################   "
        ],
        custom: [
          "........................",
          "..........####..........",
          ".........#....#.........",
          ".........#....#.........",
          "..........####..........",
          "........................"
        ]
      };

      function loadMotif(motifKey) {
        const grid = motifs[motifKey];
        if (grid) {
          document.getElementById("pixel-grid-input").value = grid.join("\n");
        }
        ['heart', 'coffee', 'custom'].forEach(k => {
          const btn = document.getElementById(`btn-motif-${k}`);
          if(!btn) return;
          if(k === motifKey) {
            btn.className = "p-3 rounded-2xl border-2 border-[#364F6B] bg-[#364F6B]/5 text-center transition flex flex-col items-center gap-1";
            btn.querySelector("span:last-child").className = "text-[11px] font-bold text-[#364F6B]";
          } else {
            btn.className = "p-3 rounded-2xl border-2 border-transparent bg-[#F5F5F5] text-center transition flex flex-col items-center gap-1 hover:border-[#364F6B]/30";
            btn.querySelector("span:last-child").className = "text-[11px] font-semibold text-[#364F6B]/70";
          }
        });
      }

      async function fetchDataFromCloud(file) {
        try {
          const res = await fetch(`/api/update?file=${file}`);
          if (!res.ok) throw new Error("Fehler beim Laden");
          return await res.json();
        } catch (err) {
          console.error(err);
          return null;
        }
      }

      async function sendData(file, content) {
        try {
          const res = await fetch("/api/update", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ file, content }),
          });
          if (!res.ok) throw new Error("Fehler beim Speichern");
          showToast("Erfolgreich gespeichert! 🚀");
        } catch (err) {
          showToast("Fehler: " + err.message);
        }
      }

      async function setMode(mode) {
        currentMode = mode;
        ["hvv", "mood", "todo"].forEach((m) => {
          const btn = document.getElementById(`btn-${m}`);
          if (m === mode) {
            btn.className = "flex-1 py-2.5 rounded-xl text-xs font-semibold transition-all duration-200 bg-[#364F6B] text-[#F5F5F5] shadow-sm";
          } else {
            btn.className = "flex-1 py-2.5 rounded-xl text-xs font-semibold transition-all duration-200 text-[#364F6B]/70 hover:text-[#364F6B]";
          }
        });

        document.getElementById("section-hvv").classList.toggle("hidden", mode !== "hvv");
        document.getElementById("section-mood").classList.toggle("hidden", mode !== "mood");
        document.getElementById("section-todo").classList.toggle("hidden", mode !== "todo");

        // Wenn in Modus gewechselt wird, Daten von GitHub laden
        if (mode === "todo") {
          const data = await fetchDataFromCloud("todo.json");
          if (data && data.tasks) {
            tasks = data.tasks;
            renderTasks();
          }
        } else if (mode === "mood") {
          const data = await fetchDataFromCloud("mood.json");
          if (data) {
            if (data.art && Array.isArray(data.art)) {
              document.getElementById("pixel-grid-input").value = data.art.join("\n");
            }
            if (data.status) document.getElementById("mood-status").value = data.status;
            if (data.quote) document.getElementById("mood-quote").value = data.quote;
          }
        }

        await sendData("config.json", { mode: mode });
      }

      function showToast(text) {
        const toast = document.getElementById("status-toast");
        toast.innerText = text;
        toast.classList.remove("opacity-0");
        toast.classList.add("opacity-100");
        setTimeout(() => {
          toast.classList.remove("opacity-100");
          toast.classList.add("opacity-0");
        }, 2500);
      }

      function renderTasks() {
        const list = document.getElementById("todo-list");
        list.innerHTML = "";
        let openCount = tasks.filter((t) => !t.done).length;
        document.getElementById("todo-counter").innerText = `${openCount} offen`;

        tasks.forEach((task, index) => {
          const item = document.createElement("div");
          item.className = `flex items-center justify-between p-3 rounded-xl transition ${task.done ? "bg-[#F5F5F5]/60 text-[#364F6B]/40 line-through" : "bg-[#F5F5F5] text-[#364F6B]"}`;
          item.innerHTML = `
            <div class="flex items-center gap-3 cursor-pointer flex-1" onclick="toggleTask(${index})">
                <div class="w-5 h-5 rounded-md border-2 flex items-center justify-center transition ${task.done ? "bg-[#3FC1C9] border-[#3FC1C9] text-white" : "border-[#364F6B]/30"}">
                    ${task.done ? "✓" : ""}
                </div>
                <span class="text-xs font-medium">${task.text}</span>
            </div>
            <button onclick="deleteTask(${index})" class="text-[#FC5185] hover:opacity-80 px-2 text-xs font-bold">✕</button>
          `;
          list.appendChild(item);
        });
      }

      async function saveTasksToCloud() {
        await sendData("todo.json", { tasks: tasks });
      }

      function toggleTask(index) {
        tasks[index].done = !tasks[index].done;
        renderTasks();
        saveTasksToCloud();
      }

      function addTodo() {
        const input = document.getElementById("new-todo-text");
        if (!input.value.trim()) return;
        tasks.unshift({ text: input.value.trim(), done: false });
        input.value = "";
        renderTasks();
        saveTasksToCloud();
      }

      function deleteTask(index) {
        tasks.splice(index, 1);
        renderTasks();
        saveTasksToCloud();
      }

      async function saveMood() {
        const rawGridText = document.getElementById("pixel-grid-input").value;
        const artArray = rawGridText.split("\n");
        const status = document.getElementById("mood-status").value;
        const quote = document.getElementById("mood-quote").value;

        await sendData("mood.json", { art: artArray, status, quote });
      }

      // Initial beim Start Daten für To-Do im Hintergrund einmal abrufen
      async function initApp() {
        loadMotif('heart');
        const todoData = await fetchDataFromCloud("todo.json");
        if (todoData && todoData.tasks) {
          tasks = todoData.tasks;
          renderTasks();
        }
      }

      initApp();
    </script>
  </body>
</html>
